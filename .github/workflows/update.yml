name: お知らせを更新

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 7:00（日本時間）。GitHub側の混雑で数十分遅れることがあります
  workflow_dispatch:        # Actions 画面から手動実行もできる

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: お知らせを取得してページを作成
        env:
          TZ: Asia/Tokyo
        run: python fetch_news.py
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/items.json data/status.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "お知らせを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
