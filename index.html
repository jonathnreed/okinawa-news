*{box-sizing:border-box}
html,body{margin:0}

a{color:inherit}

.sub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}

input[type=search]{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
label.toggle{font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
.summary{color:var(--muted);font-size:13px;margin:14px 0 4px}
.summary b{color:var(--ink)}
.day{margin-top:18px}
.day h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.day h2 .rel{color:var(--accent);margin-left:6px}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
ul.list li{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.muni{flex:0 0 auto;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap;cursor:pointer;background:none;font-family:inherit}
.muni[data-r="県"]{color:var(--r-pref)} .muni[data-r="北部"]{color:var(--r-north)} .muni[data-r="中部"]{color:var(--r-central)}

.body{min-width:0;flex:1}
.body a{text-decoration:none;overflow-wrap:anywhere}
.body a:hover{text-decoration:underline;color:var(--accent)}
.body a:visited{color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.new{font-size:11px;font-weight:700;color:var(--new);margin-left:6px;letter-spacing:.05em}
.more{display:block;margin:16px auto;font:inherit;padding:8px 22px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
details.status{margin:36px 0 48px;font-size:13px;color:var(--muted)}
details.status summary{cursor:pointer}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;margin-top:10px}
.stgrid a{text-decoration:none}
.stgrid .ng{color:var(--new)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}
@media (max-width:560px){ ul.list li{flex-direction:column;gap:4px} h1{font-size:19px} }
</style>
</head>

};

  $("list").innerHTML = '<p class="empty">データがありません。fetch_news.py を実行すると index.html が作られます。</p>';
} else {
  // 前回閲覧時刻（同じタブで再読み込みしても新着表示を保つ）
  let prev = store.sget("okn_prev");
  if (prev === null) { prev = store.get("okn_lastSeen") || ""; store.sset("okn_prev", prev); }
  store.set("okn_lastSeen", DATA.updated);
  const isNew = it => prev && it.first_seen > prev;

  const d = new Date(DATA.updated);
  $("updated").textContent = `最終更新 ${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

  const state = { q:"", region:"すべて", muni:"", period:7, onlyNew:false, limit:150 };
  try { Object.assign(state, JSON.parse(store.get("okn_filter") || "{}"), {q:"", limit:150}); } catch(e){}

  // 地域チップ
  REGIONS.forEach(r => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = r; b.dataset.r = r;
    b.onclick = () => { state.region = r; state.muni = ""; update(); };
    $("regions").appendChild(b);
  });
  // 市町村セレクト
  const counts = {}; DATA.items.forEach(i => counts[i.muni] = (counts[i.muni]||0)+1);
  let html = '<option value="">すべての市町村</option>';
  REGIONS.slice(1).forEach(r => {
    html += `<optgroup label="${r}">` + DATA.sources.filter(s => s.region === r)
      .map(s => `<option value="${s.name}">${s.name}（${counts[s.name]||0}）</option>`).join("") + "</optgroup>";
  });
  $("muni").innerHTML = html;

  $("q").oninput = e => { state.q = e.target.value.trim(); state.limit = 150; render(); };
  $("muni").onchange = e => { state.muni = e.target.value; if (state.muni) state.region = "すべて"; update(); };
  $("period").onchange = e => { state.period = +e.target.value; update(); };
  $("onlyNew").onchange = e => { state.onlyNew = e.target.checked; update(); };

  function update(){
    state.limit = 150;
    store.set("okn_filter", JSON.stringify({region:state.region, muni:state.muni, period:state.period, onlyNew:state.onlyNew}));
    render();
  }
  const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const hl = (s, q) => {
    let out = esc(s);
    if (!q) return out;
    q.split(/\s+/).filter(Boolean).forEach(w => {
      const re = new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      out = out.replace(re, m => `<mark>${m}</mark>`);
    });
    return out;
  };
  const dayKey = iso => iso.slice(0,10);
  function dayLabel(key){
    const [y,m,dd] = key.split("-").map(Number);
    const t = new Date(y, m-1, dd), today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.round((today - t) / 86400000);
    const rel = diff === 0 ? "今日" : diff === 1 ? "昨日" : "";
    return `${y !== today.getFullYear() ? y + "年" : ""}${m}月${dd}日（${WD[t.getDay()]}）` + (rel ? `<span class="rel">${rel}</span>` : "");
  }

  function render(){
    document.querySelectorAll("#regions .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.r === state.region));
    $("muni").value = state.muni; $("period").value = String(state.period); $("onlyNew").checked = state.onlyNew;
    const since = state.period ? new Date(Date.now() - state.period * 86400000).toISOString() : "";
    const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = DATA.items.filter(i =>
      (state.region === "すべて" || i.region === state.region) &&
      (!state.muni || i.muni === state.muni) &&
      (!since || new Date(i.date).toISOString() >= since) &&
      (!state.onlyNew || isNew(i)) &&
      words.every(w => (i.title + " " + i.muni + " " + (i.cat||"")).toLowerCase().includes(w)));
    const newCount = hits.filter(isNew).length;
    $("summary").innerHTML = `<b>${hits.length}</b>件` + (prev ? `（前回以降の新着 <b>${newCount}</b>件）` : "");
    if (!hits.length) { $("list").innerHTML = '<p class="empty">条件に合うお知らせはありません。</p>'; return; }
    let out = "", cur = null;
    hits.slice(0, state.limit).forEach(i => {
      const k = dayKey(i.date);
      if (k !== cur) { if (cur) out += "</ul></section>"; cur = k; out += `<section class="day"><h2>${dayLabel(k)}</h2><ul class="list">`; }
      out += `<li><button class="muni" data-r="${i.region}" data-m="${esc(i.muni)}" title="${esc(i.muni)}だけを表示">${esc(i.muni)}</button>`
           + `<div class="body"><a href="${esc(i.link)}" target="_blank" rel="noopener">${hl(i.title, state.q)}</a>`
           + (isNew(i) ? '<span class="new">NEW</span>' : "")
           + ((i.cat || !i.dated) ? `<div class="meta">${esc(i.cat||"")}${!i.dated ? (i.cat ? " ・ " : "") + "日付は取得日" : ""}</div>` : "")
           + "</div></li>";
    });
    out += "</ul></section>";
    if (hits.length > state.limit) out += `<button class="more" id="more">さらに表示（残り${hits.length - state.limit}件）</button>`;
    $("list").innerHTML = out;
    const more = $("more"); if (more) more.onclick = () => { state.limit += 150; render(); };
    document.querySelectorAll("#list .muni").forEach(b => b.onclick = () => { state.muni = b.dataset.m; state.region = "すべて"; update(); window.scrollTo({top:0}); });
  }

  $("status").innerHTML = DATA.sources.map(s =>
    `<div class="${s.ok ? "" : "ng"}"><a href="${esc(s.home)}" target="_blank" rel="noopener">${esc(s.name)}</a> ${s.ok ? s.count + "件" : "取得失敗"}</div>`).join("");
  render();
}
</script>
</body>
</html>
